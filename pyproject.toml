[project]
name = "trainingsplan"
version = "0.1.0"
description = "Individuelle Trainingsplanung auf Basis der Garmin-Connect-Historie"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "garmin-fit-sdk>=21.0",
    "polars>=1.15",
    "keyring>=25.5",
    "typer>=0.15",
]

[project.scripts]
trainingsplan = "trainingsplan.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trainingsplan"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
