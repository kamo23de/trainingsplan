<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Trainingsplan{% endblock %}</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ static_url('app.css') }}">
</head>
<body class="viz-root">
  <header class="page-header">
    <a class="brand" href="/">Trainingsplan</a>
    <nav class="nav" aria-label="Hauptnavigation">
      <a href="/" {% if active == "start" %}aria-current="page"{% endif %}>Start</a>
      <a href="/rueckblick" {% if active == "history" %}aria-current="page"{% endif %}>Rückblick</a>
      <a href="/planung" {% if active == "plan" %}aria-current="page"{% endif %}>Planung</a>
    </nav>
    <span class="muted version">v{{ version }}</span>
  </header>
  <main>{% block content %}{% endblock %}</main>

  <dialog id="activity-dialog" aria-label="Aktivitätsdetails">
    <div id="activity-body"></div>
  </dialog>
  <dialog id="info-dialog" aria-labelledby="info-title">
    <div class="info-head">
      <h3 id="info-title"></h3>
      <button class="info-close" aria-label="Schließen">×</button>
    </div>
    <div id="info-body"></div>
  </dialog>

  <script src="{{ static_url('vendor/echarts.min.js') }}"></script>
  <script src="{{ static_url('info.js') }}"></script>
  <script src="{{ static_url('common.js') }}"></script>
  <script src="{{ static_url('activity.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
